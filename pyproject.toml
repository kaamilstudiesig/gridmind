[project]
name = "gridmind"
version = "0.1.0"
description = "Agentic incident-response system for a simulated distribution grid"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "jinja2>=3.1.3",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.1.0",
    "httpx2>=2.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "dashboard*", "gridmind*"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.json"]

[tool.ruff]
line-length = 88
target-version = "py311"


